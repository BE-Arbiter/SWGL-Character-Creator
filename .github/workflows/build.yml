name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.0.0-latest+$($env:GITHUB_SHA.Substring(0,7))" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained single file)
        run: >
          dotnet publish SWGLCharacterCreator.csproj -c Release -r win-x64
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item publish/SWGLCharacterCreator.exe SWGLCharacterCreator.exe
          Compress-Archive -Path SWGLCharacterCreator.exe -DestinationPath SWGLCharacterCreator-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SWGLCharacterCreator-win-x64
          path: SWGLCharacterCreator-win-x64.zip

      # Every push to main refreshes the rolling "latest" pre-release.
      - name: Update "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes 2>$null
          gh release create latest SWGLCharacterCreator-win-x64.zip --title "Latest build" --prerelease `
            --target $env:GITHUB_SHA --notes "Automatic build of main ($($env:GITHUB_SHA.Substring(0,7)))."

      # A v* tag publishes a versioned release.
      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME SWGLCharacterCreator-win-x64.zip --title $env:GITHUB_REF_NAME --generate-notes
